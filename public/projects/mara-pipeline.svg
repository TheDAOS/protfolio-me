<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc"><title id="title">Mara document translation pipeline</title><desc id="desc">German PDF, text extraction, terminology handling, local translation, validation checks and PDF generation. Simplified overview.</desc><rect width="1200" height="750" fill="#f5f3eb"/><g font-family="Arial, sans-serif" fill="#111"><text x="64" y="70" font-size="36" font-weight="900">MARA / DOCUMENT PIPELINE</text><text x="64" y="108" font-size="20">German to English · simplified workflow</text><rect x="71" y="147" width="304" height="190" fill="#111"/><rect x="64" y="140" width="304" height="190" fill="#22d3ee" stroke="#111" stroke-width="4"/><text x="86" y="186" font-size="24" font-weight="900">01</text><text x="86" y="240" font-size="30" font-weight="900">German PDF</text><text x="86" y="282" font-size="20">Source document</text><rect x="455" y="147" width="304" height="190" fill="#111"/><rect x="448" y="140" width="304" height="190" fill="#f472b6" stroke="#111" stroke-width="4"/><text x="470" y="186" font-size="24" font-weight="900">02</text><text x="470" y="240" font-size="30" font-weight="900">Extract text</text><text x="470" y="282" font-size="20">Recover page structure</text><rect x="839" y="147" width="304" height="190" fill="#111"/><rect x="832" y="140" width="304" height="190" fill="#ffdf20" stroke="#111" stroke-width="4"/><text x="854" y="186" font-size="24" font-weight="900">03</text><text x="854" y="240" font-size="30" font-weight="900">Terminology</text><text x="854" y="282" font-size="20">Protect domain terms</text><rect x="71" y="437" width="304" height="190" fill="#111"/><rect x="64" y="430" width="304" height="190" fill="#22d3ee" stroke="#111" stroke-width="4"/><text x="86" y="476" font-size="24" font-weight="900">04</text><text x="86" y="530" font-size="30" font-weight="900">Translate</text><text x="86" y="572" font-size="20">Local CTranslate2 model</text><rect x="455" y="437" width="304" height="190" fill="#111"/><rect x="448" y="430" width="304" height="190" fill="#f472b6" stroke="#111" stroke-width="4"/><text x="470" y="476" font-size="24" font-weight="900">05</text><text x="470" y="530" font-size="30" font-weight="900">Check output</text><text x="470" y="572" font-size="20">Flag blocks for review</text><rect x="839" y="437" width="304" height="190" fill="#111"/><rect x="832" y="430" width="304" height="190" fill="#ffdf20" stroke="#111" stroke-width="4"/><text x="854" y="476" font-size="24" font-weight="900">06</text><text x="854" y="530" font-size="30" font-weight="900">Build PDF</text><text x="854" y="572" font-size="20">Typeset with Typst</text><g fill="none" stroke="#111" stroke-width="5"><path d="M380 235h52m-12-12 12 12-12 12M764 235h52m-12-12 12 12-12 12M984 345v38H216v32m-12-12 12 12 12-12M380 525h52m-12-12 12 12-12 12M764 525h52m-12-12 12 12-12 12"/></g><text x="64" y="698" font-size="20">Validation flags possible issues; it does not guarantee translation accuracy.</text></g></svg>